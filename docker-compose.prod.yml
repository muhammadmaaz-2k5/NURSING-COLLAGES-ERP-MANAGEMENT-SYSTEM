services:
  # ----------------------------------------------------
  # PostgreSQL Database (Single-Tenant College DB)
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: pern_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-nursing_college_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nursing_college_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pern_network

  # ----------------------------------------------------
  # Redis Cache & BullMQ Queue Broker
  # ----------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pern_redis_prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redispassword123}"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pern_network

  # ----------------------------------------------------
  # NestJS Production Backend API
  # ----------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: pern_api_prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: api
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/${POSTGRES_DB:-nursing_college_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword123}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-change-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "4000:4000"
    networks:
      - pern_network

  # ----------------------------------------------------
  # Next.js Production Web Frontend
  # ----------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: pern_web_prod
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    ports:
      - "3000:3000"
    networks:
      - pern_network

volumes:
  postgres_data:
  redis_data:

networks:
  pern_network:
    driver: bridge
